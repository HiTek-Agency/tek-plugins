<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Tek Chrome Control</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header>
			<h1>Tek Chrome Control</h1>
		</header>

		<section class="status-row">
			<span id="status-dot" class="dot dot-disconnected" aria-hidden="true"></span>
			<span id="status-text">Not connected — paste token</span>
		</section>

		<section class="versions-row">
			<span>Extension v<span id="extension-version">—</span></span>
			<span class="sep">·</span>
			<span>Gateway: <span id="gateway-version">—</span></span>
		</section>

		<section class="control-section" aria-labelledby="control-heading">
			<div class="control-heading-row">
				<div>
					<h2 id="control-heading">Agent control</h2>
					<p id="control-summary">Paused · no tabs granted</p>
				</div>
				<span id="control-badge" class="control-badge paused">Paused</span>
			</div>

			<div class="active-tab">
				<span class="eyebrow">Active tab</span>
				<strong id="active-tab-title">Loading…</strong>
				<span id="active-tab-url" class="active-tab-url"></span>
			</div>

			<div class="control-actions">
				<button id="grant-tab" type="button">Allow this tab</button>
				<button id="revoke-tab" type="button" class="secondary">Revoke tab</button>
			</div>

			<button id="toggle-control" type="button" class="takeover">Resume agents</button>
			<p class="control-note">Only granted tabs are visible to agents. Take over pauses every model immediately.</p>
		</section>

		<section id="token-section" class="token-section">
			<label for="token-input">Paste token from Tek desktop</label>
			<input id="token-input" type="text" placeholder="tek-chrome-…" autocomplete="off" spellcheck="false" />
			<button id="save-token" type="button">Save</button>
		</section>

		<footer>
			<button id="reset-connection" type="button" class="secondary">Reset connection</button>
		</footer>

		<script src="popup.js" type="module"></script>
	</body>
</html>
